name: Build and Attach GlassPane.exe to Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target release tag to attach GlassPane.exe to (e.g. v1.4.1, or "latest" for the most recent release)'
        required: true
        default: 'latest'
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Compile GlassPane.exe (MinGW-w64) & Upload to Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure MinGW-w64 (g++ and windres) is in PATH
        shell: pwsh
        run: |
          $candidatePaths = @(
            "C:\msys64\ucrt64\bin",
            "C:\msys64\mingw64\bin",
            "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
          )

          $foundPath = $null
          foreach ($dir in $candidatePaths) {
            if ((Test-Path (Join-Path $dir "g++.exe")) -and (Test-Path (Join-Path $dir "windres.exe"))) {
              $foundPath = $dir
              break
            }
          }

          if (-not $foundPath) {
            if (-not (Get-Command g++.exe -ErrorAction SilentlyContinue) -or -not (Get-Command windres.exe -ErrorAction SilentlyContinue)) {
              Write-Host "MinGW-w64 not found in default paths; installing via Chocolatey..."
              choco install mingw -y --no-progress
              $foundPath = "C:\ProgramData\chocolatey\lib\mingw\tools\install\mingw64\bin"
            }
          }

          if ($foundPath) {
            Write-Host "Using MinGW-w64 toolchain from: $foundPath"
            Add-Content -Path $env:GITHUB_PATH -Value $foundPath
            $env:Path = "$foundPath;$env:Path"
          }

          g++ --version
          windres --version

      - name: Compile GlassPane.exe from /Source
        shell: pwsh
        run: |
          Write-Host "Compiling Win32 icon resource Source/GlassPane.rc..."
          windres -I Source Source/GlassPane.rc -O coff -o Source/GlassPane.res
          if ($LASTEXITCODE -ne 0) {
            throw "windres failed with exit code $LASTEXITCODE"
          }

          Write-Host "Compiling and statically linking Source/GlassPane.cpp..."
          g++ -O2 -municode -mwindows -static -static-libgcc -static-libstdc++ `
            Source/GlassPane.cpp Source/GlassPane.res `
            -o GlassPane.exe `
            -luser32 -lshell32 -ldwmapi -lgdi32 -lcomctl32 -lgdiplus
          if ($LASTEXITCODE -ne 0) {
            throw "g++ compilation failed with exit code $LASTEXITCODE"
          }

          Remove-Item Source/GlassPane.res -ErrorAction SilentlyContinue

          if (-not (Test-Path ".\GlassPane.exe")) {
            throw "GlassPane.exe was not produced by the build."
          }

          $exeInfo = Get-Item ".\GlassPane.exe"
          $sha256 = (Get-FileHash ".\GlassPane.exe" -Algorithm SHA256).Hash
          Write-Host "Successfully built GlassPane.exe ($($exeInfo.Length) bytes)"
          Write-Host "SHA-256: $sha256"

      - name: Upload GlassPane.exe as workflow build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlassPane-Windows-x64
          path: GlassPane.exe
          if-no-files-found: error

      - name: Resolve target release tag and attach GlassPane.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          $targetTag = ""

          if ($env:EVENT_NAME -eq "release") {
            $targetTag = $env:RELEASE_EVENT_TAG
            Write-Host "Triggered by published release event for tag: $targetTag"
          } else {
            $requested = $env:INPUT_RELEASE_TAG.Trim()
            if ([string]::IsNullOrWhiteSpace($requested) -or ($requested -ieq "latest")) {
              Write-Host "Resolving most recent release in $env:REPO..."
              $releasesJson = gh api "repos/$env:REPO/releases?per_page=1"
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to query releases for $env:REPO"
              }
              $releases = $releasesJson | ConvertFrom-Json
              if (-not $releases -or $releases.Count -eq 0) {
                throw "No existing releases found in $env:REPO. Please create a release first or specify a valid release tag."
              }
              $targetTag = $releases[0].tag_name
              Write-Host "Resolved latest release tag: $targetTag"
            } else {
              $targetTag = $requested
              Write-Host "Manual workflow dispatch targeting release tag: $targetTag"
            }
          }

          Write-Host "Uploading GlassPane.exe to release '$targetTag' in $env:REPO..."
          gh release upload "$targetTag" ".\GlassPane.exe#GlassPane.exe" --repo "$env:REPO" --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to attach GlassPane.exe to release '$targetTag'."
          }

          Write-Host "Successfully attached GlassPane.exe to release '$targetTag'."
